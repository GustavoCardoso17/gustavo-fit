<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0B0F17" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Gustavo Fit" />
  <title>GUSTAVO FIT • Treino Sem Frescura</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23FF5500'/%3E%3Cpath d='M25 40h8v20h-8zm42 0h8v20h-8zM33 47h34v6H33zM18 44h7v12h-7zm57 0h7v12h-7z' fill='%23FFFFFF'/%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23FF5500'/%3E%3Cpath d='M25 40h8v20h-8zm42 0h8v20h-8zM33 47h34v6H33zM18 44h7v12h-7zm57 0h7v12h-7z' fill='%23FFFFFF'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg-main: #0B0F17;
      --bg-card: #131A26;
      --bg-card-inner: #0F141E;
      --border-subtle: #1F293A;
      --accent: #FF5500;
      --accent-soft: rgba(255, 85, 0, 0.14);
      --green: #10B981;
      --green-soft: rgba(16, 185, 129, 0.14);
      --blue: #38BDF8;
      --blue-soft: rgba(56, 189, 248, 0.12);
      --yt-red: #EF4444;
      --yt-soft: rgba(239, 68, 68, 0.14);
      --text-primary: #F8FAFC;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      min-height: 100vh;
      padding-bottom: 44px;
      overflow-x: hidden;
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
      padding: 16px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 18px;
      padding-top: 4px;
    }

    .brand { display: flex; align-items: center; gap: 10px; }

    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 4px 14px rgba(255, 85, 0, 0.35);
    }

    .brand-title { font-size: 16px; font-weight: 800; letter-spacing: 0.4px; line-height: 1.1; }
    .brand-title span { color: var(--accent); }

    .save-status {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: var(--blue);
      margin-top: 3px;
      font-weight: 500;
    }

    .save-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--blue); }

    .timer-group { display: flex; align-items: center; gap: 6px; }

    .timer-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 999px;
      padding: 6px 12px;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      font-size: 14px;
    }

    .timer-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-muted); }
    .timer-dot.running { background: var(--green); box-shadow: 0 0 8px var(--green); }

    .icon-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .play-btn { background: none; border: none; color: var(--blue); cursor: pointer; display: flex; align-items: center; padding: 2px; }

    .week-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      margin-bottom: 18px;
    }

    .day-pill {
      position: relative;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 10px 4px;
      text-align: center;
      cursor: pointer;
    }

    .day-pill.active {
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 4px 14px rgba(255, 85, 0, 0.35);
    }

    .today-badge {
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%);
      background: #22D3EE;
      color: #06202A;
      font-size: 9px;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 999px;
    }

    .day-name { font-size: 12px; font-weight: 800; color: var(--text-primary); }
    .day-sub { font-size: 10px; font-weight: 700; margin-top: 3px; color: var(--text-secondary); }
    .day-pill.off .day-sub { color: var(--blue); }
    .day-pill.active .day-sub { color: #FFFFFF; }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 14px;
    }

    .tag-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--green-soft);
      color: var(--green);
      border: 1px solid rgba(16, 185, 129, 0.25);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    .tag-pill.workout {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: rgba(255, 85, 0, 0.25);
    }

    .hero-title { font-size: 20px; font-weight: 800; line-height: 1.25; text-transform: uppercase; margin-bottom: 8px; }
    .hero-desc { font-size: 13px; line-height: 1.5; color: var(--text-secondary); margin-bottom: 16px; }

    .progress-box {
      background: var(--bg-card-inner);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 12px 14px;
    }

    .progress-header { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; margin-bottom: 8px; }
    .progress-header span:last-child { color: var(--blue); }
    .progress-track { width: 100%; height: 7px; background: #1B2434; border-radius: 999px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), #FF8800); border-radius: 999px; transition: width 0.25s ease; }

    .section-label { font-size: 11px; font-weight: 800; letter-spacing: 0.8px; color: var(--text-secondary); text-transform: uppercase; margin-bottom: 12px; }

    .task-item {
      background: var(--bg-card-inner);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .task-item:last-child { margin-bottom: 0; }
    .task-item.done { border-color: rgba(16, 185, 129, 0.45); background: rgba(16, 185, 129, 0.05); }

    .task-top { display: flex; align-items: center; gap: 12px; cursor: pointer; }

    .checkbox {
      width: 22px;
      height: 22px;
      border-radius: 7px;
      border: 2px solid #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .task-item.done .checkbox { background: var(--green); border-color: var(--green); }
    .task-info { flex: 1; }
    .task-name { font-size: 14px; font-weight: 700; color: var(--text-primary); }
    .task-item.done .task-name { text-decoration: line-through; color: var(--text-secondary); }
    .task-meta { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

    /* Action Buttons Row (Demo & YouTube) */
    .action-bar {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .detail-btn, .yt-btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      border: 1px solid var(--border-subtle);
    }

    .detail-btn {
      background: var(--blue-soft);
      color: var(--blue);
      border-color: rgba(56, 189, 248, 0.25);
    }

    .detail-btn.open {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: rgba(255, 85, 0, 0.35);
    }

    .yt-btn {
      background: var(--yt-soft);
      color: #FCA5A5;
      border-color: rgba(239, 68, 68, 0.28);
    }

    /* Expandable Exercise Guide */
    .guide-drawer {
      display: none;
      margin-top: 12px;
      padding: 12px;
      background: #0A0E15;
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
    }

    .guide-drawer.show { display: block; }

    .demo-box {
      background: #111827;
      border: 1px solid #1E293B;
      border-radius: 10px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 10px;
    }

    .demo-caption {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 700;
      margin-top: 6px;
      letter-spacing: 0.5px;
    }

    .muscle-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 10px;
    }

    .m-tag {
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      background: #1E293B;
      color: var(--text-secondary);
    }

    .m-tag.primary {
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid rgba(255, 85, 0, 0.3);
    }

    .steps-title {
      font-size: 11px;
      font-weight: 800;
      color: var(--text-primary);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .steps-list {
      padding-left: 16px;
      font-size: 12px;
      line-height: 1.5;
      color: var(--text-secondary);
    }

    .steps-list li { margin-bottom: 4px; }

    /* SVG Animations */
    @keyframes pressMove { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-16px); } }
    @keyframes pullMove { 0%, 100% { transform: translateY(-14px); } 50% { transform: translateY(10px); } }
    @keyframes flyMove { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-38deg); } }
    @keyframes squatMove { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(14px); } }
    @keyframes curlMove { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-55deg); } }
    @keyframes runPulse { 0%, 100% { transform: translateX(-4px); } 50% { transform: translateX(4px); } }

    .anim-press { animation: pressMove 2.2s ease-in-out infinite; }
    .anim-pull { animation: pullMove 2.2s ease-in-out infinite; }
    .anim-fly { transform-origin: 60px 34px; animation: flyMove 2.2s ease-in-out infinite; }
    .anim-squat { animation: squatMove 2.4s ease-in-out infinite; }
    .anim-curl { transform-origin: 55px 42px; animation: curlMove 2s ease-in-out infinite; }
    .anim-run { animation: runPulse 1.2s ease-in-out infinite; }

    /* Editable Weight Controls */
    .weight-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--border-subtle);
    }

    .weight-label { font-size: 11px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; }
    .weight-controls { display: flex; align-items: center; gap: 6px; }

    .step-btn {
      background: #1A2333;
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      width: 30px;
      height: 30px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .weight-input {
      width: 64px;
      height: 30px;
      background: var(--bg-main);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      color: var(--text-primary);
      text-align: center;
      font-size: 13px;
      font-weight: 700;
    }

    .unit-text { font-size: 12px; color: var(--text-secondary); font-weight: 600; }

    .footer-actions { display: flex; justify-content: center; margin-top: 16px; }

    .reset-day-btn {
      background: transparent;
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 999px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <div class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6.5 6.5h11M6.5 17.5h11M4 9v6M20 9v6M2 10.5v3M22 10.5v3M12 6.5v11"/>
          </svg>
        </div>
        <div>
          <div class="brand-title">GUSTAVO <span>FIT</span></div>
          <div class="save-status">
            <span class="save-dot"></span>
            <span id="saveLabel">✓ Salvo no aparelho</span>
          </div>
        </div>
      </div>

      <div class="timer-group">
        <div class="timer-pill">
          <span class="timer-dot" id="timerDot"></span>
          <span id="timerDisplay">00:00</span>
          <button class="play-btn" id="timerToggle" aria-label="Iniciar ou pausar cronômetro">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
          </button>
        </div>
        <button class="icon-btn" id="timerReset" aria-label="Zerar cronômetro">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="week-grid" id="weekGrid"></div>

    <div class="card">
      <div class="tag-pill" id="dayBadge"></div>
      <h1 class="hero-title" id="heroTitle"></h1>
      <p class="hero-desc" id="heroDesc"></p>

      <div class="progress-box">
        <div class="progress-header">
          <span id="progressLabel">Checklist do Dia</span>
          <span id="progressStats">0/0 (0%)</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progressFill" style="width: 0%"></div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="section-label" id="sectionLabel">EXERCÍCIOS & METAS</div>
      <div id="taskList"></div>
    </div>

    <div class="footer-actions">
      <button class="reset-day-btn" id="resetDayBtn">Limpar marcações de hoje</button>
    </div>
  </div>

  <script>
    const DEMOS = {
      press: `<svg width="150" height="72" viewBox="0 0 150 72"><rect x="35" y="52" width="80" height="6" rx="3" fill="#334155"/><circle cx="75" cy="42" r="7" fill="#94A3B8"/><g class="anim-press"><line x1="25" y1="34" x2="125" y2="34" stroke="#FF5500" stroke-width="4" stroke-linecap="round"/><rect x="20" y="25" width="7" height="18" rx="2" fill="#F8FAFC"/><rect x="123" y="25" width="7" height="18" rx="2" fill="#F8FAFC"/></g></svg>`,
      pull: `<svg width="150" height="72" viewBox="0 0 150 72"><line x1="75" y1="4" x2="75" y2="24" stroke="#64748B" stroke-width="2" stroke-dasharray="3 2"/><circle cx="75" cy="54" r="8" fill="#94A3B8"/><g class="anim-pull"><path d="M35 24 Q75 20 115 24" stroke="#FF5500" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="35" cy="24" r="3" fill="#F8FAFC"/><circle cx="115" cy="24" r="3" fill="#F8FAFC"/></g></svg>`,
      fly: `<svg width="150" height="72" viewBox="0 0 150 72"><circle cx="60" cy="20" r="7" fill="#94A3B8"/><line x1="60" y1="27" x2="60" y2="58" stroke="#94A3B8" stroke-width="5" stroke-linecap="round"/><g class="anim-fly"><line x1="60" y1="34" x2="102" y2="34" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/><circle cx="105" cy="34" r="5" fill="#FF5500"/></g></svg>`,
      squat: `<svg width="150" height="72" viewBox="0 0 150 72"><line x1="30" y1="64" x2="120" y2="64" stroke="#334155" stroke-width="3"/><g class="anim-squat"><circle cx="75" cy="16" r="7" fill="#94A3B8"/><line x1="42" y1="25" x2="108" y2="25" stroke="#FF5500" stroke-width="4" stroke-linecap="round"/><line x1="75" y1="23" x2="75" y2="44" stroke="#94A3B8" stroke-width="5" stroke-linecap="round"/><polyline points="63,62 68,44 82,44 87,62" fill="none" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/></g></svg>`,

      cardio: `<svg width="150" height="72" viewBox="0 0 150 72"><line x1="25" y1="58" x2="125" y2="50" stroke="#334155" stroke-width="5" stroke-linecap="round"/><g class="anim-run"><circle cx="75" cy="20" r="6" fill="#FF5500"/><polyline points="62,48 74,34 86,44" fill="none" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/><line x1="74" y1="26" x2="74" y2="36" stroke="#F8FAFC" stroke-width="4"/></g></svg>`

    const WORKOUT_PLAN = {

          {
            id: "seg_1",

          {

            demo: "pull",
            primaryMuscles: ["Tríceps Braquial (Cabeça Lateral e Longa)"],

            steps: [
              "Trave os cotovelos colados ao lado do tronco sem balançar os ombros.",

    const TODAY_KEY = JS_DAY_TO_KEY[new Date().getDay()];

    const STORAGE_KEY = "gustavo_fit_v1";
    let state = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
    if (!state.completed) state.completed = {};
    if (!state.weights) state.weights = {};

    let selectedDay = TODAY_KEY;
    let openDrawers = {};

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      const label = document.getElementById("saveLabel");
      label.textContent = "✓ Salvo agora";
      setTimeout(() => { label.textContent = "✓ Salvo no aparelho"; }, 1200);
    }

    function getDayCompletion(dayKey) {
      const tasks = WORKOUT_PLAN[dayKey].tasks;
      const doneCount = tasks.filter(t => state.completed[t.id]).length;
      const pct = tasks.length ? Math.round((doneCount / tasks.length) * 100) : 0;
      return { doneCount, total: tasks.length, pct };
    }

    function renderWeek() {
      const grid = document.getElementById("weekGrid");
      grid.innerHTML = "";
      DAY_KEYS.forEach(key => {
        const day = WORKOUT_PLAN[key];
        const { pct } = getDayCompletion(key);
        const pill = document.createElement("div");
        pill.className = `day-pill ${day.isOff ? "off" : ""} ${selectedDay === key ? "active" : ""}`;
        pill.onclick = () => { selectedDay = key; renderAll(); };
        const todayBadge = key === TODAY_KEY ? `<div class="today-badge">HOJE</div>` : "";
        const subText = day.isOff ? (pct > 0 ? `${pct}%` : "OFF") : `${pct}%`;
        pill.innerHTML = `${todayBadge}<div class="day-name">${day.short}</div><div class="day-sub">${subText}</div>`;
        grid.appendChild(pill);
      });
    }

    function renderDayContent() {
      const day = WORKOUT_PLAN[selectedDay];
      const { doneCount, total, pct } = getDayCompletion(selectedDay);

      const badge = document.getElementById("dayBadge");
      badge.className = `tag-pill ${day.isOff ? "" : "workout"}`;
      badge.textContent = (day.isOff ? "🔋 " : "🔥 ") + day.badge;

      document.getElementById("heroTitle").textContent = day.title;
      document.getElementById("heroDesc").textContent = day.desc;
      document.getElementById("progressLabel").textContent = day.progressTitle;
      document.getElementById("progressStats").textContent = `${doneCount}/${total} (${pct}%)`;
      document.getElementById("progressFill").style.width = `${pct}%`;
      document.getElementById("sectionLabel").textContent = day.sectionTitle;

      const list = document.getElementById("taskList");
      list.innerHTML = "";

      day.tasks.forEach(task => {
        const isDone = !!state.completed[task.id];
        const isOpen = !!openDrawers[task.id];
        const currentWeight = state.weights[task.id] !== undefined ? state.weights[task.id] : task.defaultWeight;

        const item = document.createElement("div");
        item.className = `task-item ${isDone ? "done" : ""}`;

        const top = document.createElement("div");
        top.className = "task-top";
        top.onclick = () => {
          state.completed[task.id] = !state.completed[task.id];
          saveState();
          renderAll();
        };

        top.innerHTML = `
          <div class="checkbox">
            ${isDone ? `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>` : ""}
          </div>
          <div class="task-info">
            <div class="task-name">${task.name}</div>
            <div class="task-meta">${task.meta}</div>
          </div>
        `;
        item.appendChild(top);

        if (task.steps) {
          const actionBar = document.createElement("div");
          actionBar.className = "action-bar";

          const toggleGuideBtn = document.createElement("button");
          toggleGuideBtn.className = `detail-btn ${isOpen ? "open" : ""}`;
          toggleGuideBtn.innerHTML = isOpen ? "▲ Ocultar Guia" : "👁️ Ver Execução & Músculos";
          toggleGuideBtn.onclick = () => {
            openDrawers[task.id] = !openDrawers[task.id];
            renderDayContent();
          };

          const ytUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(task.ytQuery)}`;
          const ytLink = document.createElement("a");
          ytLink.className = "yt-btn";
          ytLink.href = ytUrl;
          ytLink.target = "_blank";
          ytLink.rel = "noopener noreferrer";
          ytLink.innerHTML = "▶ YouTube";

          actionBar.appendChild(toggleGuideBtn);
          actionBar.appendChild(ytLink);

          drawer.className = `guide-drawer ${isOpen ? "show" : ""}`;
          const primaryHtml = task.primaryMuscles.map(m => `<span class="m-tag primary">Principal: ${m}</span>`).join("");
